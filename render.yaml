# Blueprint de Render — Static Site (sin build, HTML/CSS/JS puro)
services:
  - type: web
    runtime: static
    name: dulce-emma
    buildCommand: "echo 'sitio estatico, sin build'"
    staticPublishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
